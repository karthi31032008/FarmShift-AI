
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmShift-AI | Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7faf7;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #218838;
        }

        .logo span {
            color: #222;
        }

        .top-link {
            color: #218838;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #218838;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -12px;
            margin-bottom: 20px;
            color: #218838;
            text-decoration: none;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #218838;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #176b2b;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 23px 0;
            color: #999;
        }

        .or::before,
        .or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

<header>
    <div class="logo">🌱 FarmShift<span>-AI</span></div>
    <a href="/signup" class="top-link">Sign Up</a>
</header>

<div class="container">

    <div class="login-box">

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Sign in to your FarmShift-AI account
        </p>

        <form action="/login" method="POST">

            <label>Username or Email</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username or email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <a href="/forgot-password" class="forgot">
                Forgot Password?
            </a>

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <div class="or">OR</div>

        <button
            type="button"
            class="google-btn"
            onclick="window.location.href='/google-login'">

            🌐 Continue with Google

        </button>

        <p class="signup">
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </p>

    </div>

</div>

<footer>
    © 2026 FarmShift-AI | Smart Farming Solutions
</footer>

</body>
</html>
