
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmShift-AI | Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f7faf7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 20px 7%;
        }

        .logo {
            color: #218838;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #222;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .signup-box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #00000012;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        input:focus {
            outline: none;
            border-color: #218838;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signin {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        a {
            color: #218838;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 18px;
            color: #999;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>

<body>

<header>
    <div class="logo">🌱 FarmShift<span>-AI</span></div>
</header>

<div class="container">

    <div class="signup-box">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join FarmShift-AI today!
        </p>

        <form action="/signup" method="POST">

            <label>Full Name</label>
            <input type="text" name="name"
                   placeholder="Enter your name" required>

            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Create username" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create password"
                   minlength="6" required>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="signin">
            Already have an account?
            <a href="/login">Sign In</a>
        </p>

    </div>

</div>

<footer>
    © 2026 FarmShift-AI
</footer>

<script type="module">
import { auth } from "{{ url_for('static', filename='auth.js') }}";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const form = document.querySelector("form");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = form.querySelector('[name="name"]').value;
    const email = form.querySelector('[name="email"]').value;
    const password = form.querySelector('[name="password"]').value;

    try {
        const result = await createUserWithEmailAndPassword(
            auth, email, password
        );

        await updateProfile(result.user, {
            displayName: name
        });

        alert("Account created successfully!");

        window.location.href = "/dashboard";

    } catch (error) {
        alert(error.message);
    }
});
</script>
    
</body>
</html>
